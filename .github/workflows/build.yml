name: Build Flutter Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Add geolocator
        run: flutter pub add geolocator

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="AZ Köməkçi"/' android/app/src/main/AndroidManifest.xml

      - name: Add internet permission
        run: sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: az-komekci-apk
          path: build/app/outputs/flutter-apk/app-release.apk
